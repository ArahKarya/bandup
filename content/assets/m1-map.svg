<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Harbourside Maritime Museum, ground floor</title>
  <desc id="d">Plan of the ground floor. The harbour is to the north and the car park to the south. The main entrance is in the middle of the south wall, leading to reception and then the central atrium. Rooms A, B and C run along the north side; D and E are to the west and east of the atrium; F and G are either side of reception. H is a small building on the terrace outside the east wall, reached through room E.</desc>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <!-- Harbour -->
  <rect x="40" y="10" width="560" height="34" fill="#dbe9f6" stroke="#7aa6cf"/>
  <text x="320" y="33" text-anchor="middle" font-size="15" fill="#2c5d8a">HARBOUR</text>

  <!-- Building outline -->
  <rect x="50" y="60" width="540" height="390" fill="#fafafa" stroke="#222" stroke-width="3"/>

  <!-- Grid walls -->
  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="50" y1="190" x2="590" y2="190"/>
    <line x1="50" y1="320" x2="590" y2="320"/>
    <line x1="230" y1="60" x2="230" y2="450"/>
    <line x1="410" y1="60" x2="410" y2="450"/>
  </g>

  <!-- Open atrium and reception (doorways shown as gaps) -->
  <g stroke="#fafafa" stroke-width="4">
    <line x1="290" y1="320" x2="350" y2="320"/>
    <line x1="290" y1="190" x2="350" y2="190"/>
    <line x1="230" y1="235" x2="230" y2="275"/>
    <line x1="410" y1="235" x2="410" y2="275"/>
    <line x1="230" y1="365" x2="230" y2="405"/>
    <line x1="410" y1="365" x2="410" y2="405"/>
    <line x1="290" y1="450" x2="350" y2="450"/>
    <line x1="140" y1="190" x2="180" y2="190"/>
    <line x1="490" y1="190" x2="530" y2="190"/>
    <line x1="590" y1="235" x2="590" y2="275"/>
  </g>

  <!-- Room letters -->
  <g font-size="34" font-weight="bold" text-anchor="middle" fill="#111">
    <text x="140" y="137">A</text>
    <text x="320" y="137">B</text>
    <text x="500" y="137">C</text>
    <text x="140" y="267">D</text>
    <text x="500" y="267">E</text>
    <text x="140" y="397">F</text>
    <text x="500" y="397">G</text>
  </g>

  <!-- Atrium -->
  <text x="320" y="245" text-anchor="middle" font-size="15" fill="#333">ATRIUM</text>
  <text x="320" y="265" text-anchor="middle" font-size="12" fill="#555">(model ship)</text>
  <ellipse cx="320" cy="290" rx="40" ry="10" fill="#e8dcc6" stroke="#8a6d3b"/>

  <!-- Stairs in the atrium, west side -->
  <g stroke="#555" stroke-width="1.5">
    <rect x="240" y="200" width="36" height="60" fill="#eeeeee"/>
    <line x1="240" y1="212" x2="276" y2="212"/>
    <line x1="240" y1="224" x2="276" y2="224"/>
    <line x1="240" y1="236" x2="276" y2="236"/>
    <line x1="240" y1="248" x2="276" y2="248"/>
  </g>
  <text x="258" y="276" text-anchor="middle" font-size="11" fill="#333">Stairs</text>

  <!-- Reception -->
  <rect x="285" y="370" width="70" height="26" fill="#efefef" stroke="#555"/>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#333">Reception</text>

  <!-- Entrance -->
  <text x="320" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">MAIN ENTRANCE</text>
  <path d="M320 492 L320 458 M312 466 L320 456 L328 466" stroke="#111" stroke-width="2.5" fill="none"/>

  <!-- Car park -->
  <text x="140" y="495" text-anchor="middle" font-size="13" fill="#555">CAR PARK</text>

  <!-- Terrace and H -->
  <rect x="600" y="190" width="140" height="130" fill="#eef5e8" stroke="#6f9a52" stroke-dasharray="6 4"/>
  <text x="670" y="310" text-anchor="middle" font-size="12" fill="#4f7a36">TERRACE</text>
  <rect x="640" y="215" width="70" height="60" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <text x="675" y="257" text-anchor="middle" font-size="30" font-weight="bold" fill="#111">H</text>

  <!-- Compass -->
  <g transform="translate(700 80)">
    <circle r="22" fill="none" stroke="#555"/>
    <path d="M0 -18 L6 4 L0 0 L-6 4 Z" fill="#111"/>
    <text y="-26" text-anchor="middle" font-size="13" font-weight="bold">N</text>
  </g>
</svg>
