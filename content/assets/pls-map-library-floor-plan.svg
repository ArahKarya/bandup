<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Kelby Library ground floor plan</title>
  <desc id="desc">Ground floor plan of a library. The main entrance is in the middle of the front (bottom) wall with the reception desk just inside. An open-air courtyard is in the centre. The lift and stairs are in the back right-hand corner. Letters A to H mark rooms and areas.</desc>
  <rect width="640" height="460" fill="#f7f5f0"/>

  <!-- Outer walls -->
  <rect x="30" y="30" width="580" height="370" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <!-- Entrance gap -->
  <rect x="290" y="396" width="60" height="8" fill="#ffffff"/>
  <path d="M320 445 L320 410" stroke="#333" stroke-width="2"/>
  <path d="M313 418 L320 406 L327 418 Z" fill="#333"/>
  <text x="320" y="440" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" dx="70">MAIN ENTRANCE</text>

  <!-- Reception desk -->
  <rect x="270" y="320" width="100" height="26" fill="#e3d3b5" stroke="#8a6d4b"/>
  <text x="320" y="338" font-size="12" font-weight="bold" fill="#5a4630" text-anchor="middle">RECEPTION</text>

  <!-- Courtyard -->
  <rect x="250" y="120" width="140" height="110" fill="#cfe6c4" stroke="#5f8f55" stroke-width="2"/>
  <text x="320" y="170" font-size="14" font-weight="bold" fill="#3d6b35" text-anchor="middle">COURTYARD</text>
  <text x="320" y="188" font-size="11" fill="#3d6b35" text-anchor="middle">(open air)</text>

  <!-- Lift and stairs (back right corner) -->
  <rect x="440" y="36" width="60" height="54" fill="#e6e6e6" stroke="#666"/>
  <text x="470" y="68" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">LIFT</text>
  <rect x="510" y="36" width="94" height="54" fill="#e6e6e6" stroke="#666"/>
  <g stroke="#999"><line x1="520" y1="40" x2="520" y2="86"/><line x1="535" y1="40" x2="535" y2="86"/><line x1="550" y1="40" x2="550" y2="86"/><line x1="565" y1="40" x2="565" y2="86"/><line x1="580" y1="40" x2="580" y2="86"/><line x1="595" y1="40" x2="595" y2="86"/></g>
  <text x="557" y="68" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">STAIRS</text>

  <!-- Front / back labels -->
  <text x="320" y="22" font-size="11" fill="#666" text-anchor="middle">BACK OF BUILDING</text>

  <!-- Letters A-H -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="120" cy="340" r="15" fill="#2c6fb7"/><text x="120" y="346">A</text>
    <circle cx="90" cy="215" r="15" fill="#2c6fb7"/><text x="90" y="221">B</text>
    <circle cx="90" cy="80" r="15" fill="#2c6fb7"/><text x="90" y="86">C</text>
    <circle cx="320" cy="75" r="15" fill="#2c6fb7"/><text x="320" y="81">D</text>
    <circle cx="550" cy="215" r="15" fill="#2c6fb7"/><text x="550" y="221">E</text>
    <circle cx="520" cy="340" r="15" fill="#2c6fb7"/><text x="520" y="346">F</text>
    <circle cx="210" cy="175" r="15" fill="#2c6fb7"/><text x="210" y="181">G</text>
    <circle cx="430" cy="175" r="15" fill="#2c6fb7"/><text x="430" y="181">H</text>
  </g>
</svg>
