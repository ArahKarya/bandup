<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Diagram of a fog collector with five numbered parts">
  <title>A fog collector</title>
  <defs>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0 L10 10 M10 0 L0 10" stroke="#5b7a99" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a96a3"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#ffffff"/>
  <!-- ground -->
  <path d="M0 380 Q360 360 720 380 L720 440 L0 440 z" fill="#e7e1d3"/>
  <!-- wind and fog -->
  <g stroke="#8a96a3" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M20 110 L120 110"/>
    <path d="M20 160 L120 160"/>
    <path d="M20 210 L120 210"/>
  </g>
  <text x="22" y="95" font-size="14" fill="#55606b">fog + wind</text>
  <!-- cables -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="190" y1="70" x2="135" y2="378"/>
    <line x1="530" y1="70" x2="585" y2="378"/>
  </g>
  <!-- posts -->
  <rect x="182" y="60" width="16" height="320" fill="#8b5a2b"/>
  <rect x="522" y="60" width="16" height="320" fill="#8b5a2b"/>
  <!-- mesh -->
  <rect x="198" y="75" width="324" height="180" fill="url(#mesh)" stroke="#5b7a99" stroke-width="2"/>
  <!-- gutter -->
  <path d="M195 262 L525 262 L520 280 L200 280 z" fill="#9aa5b1" stroke="#333" stroke-width="1.5"/>
  <!-- pipe -->
  <path d="M525 272 L600 272 L600 300" fill="none" stroke="#333" stroke-width="6"/>
  <!-- tank -->
  <rect x="565" y="300" width="80" height="78" fill="#cfd8e0" stroke="#333" stroke-width="2"/>
  <rect x="560" y="294" width="90" height="10" fill="#7d8b99" stroke="#333" stroke-width="1.5"/>
  <!-- labels -->
  <g font-size="16" font-weight="bold" fill="#111">
    <line x1="360" y1="165" x2="360" y2="30" stroke="#111" stroke-width="1"/>
    <circle cx="360" cy="22" r="14" fill="#fff" stroke="#111"/>
    <text x="355" y="28">1</text>

    <line x1="530" y1="180" x2="640" y2="140" stroke="#111" stroke-width="1"/>
    <circle cx="654" cy="135" r="14" fill="#fff" stroke="#111"/>
    <text x="649" y="141">2</text>

    <line x1="160" y1="250" x2="70" y2="290" stroke="#111" stroke-width="1"/>
    <circle cx="56" cy="296" r="14" fill="#fff" stroke="#111"/>
    <text x="51" y="302">3</text>

    <line x1="360" y1="280" x2="360" y2="330" stroke="#111" stroke-width="1"/>
    <circle cx="360" cy="344" r="14" fill="#fff" stroke="#111"/>
    <text x="355" y="350">4</text>

    <line x1="645" y1="340" x2="690" y2="300" stroke="#111" stroke-width="1"/>
    <circle cx="700" cy="290" r="14" fill="#fff" stroke="#111"/>
    <text x="695" y="296">5</text>
  </g>
</svg>
