name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bandup
          POSTGRES_PASSWORD: bandup
          POSTGRES_DB: bandup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bandup" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bandup:bandup@localhost:5432/bandup
      APP_ENCRYPTION_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm exec prisma migrate deploy && pnpm content:sync
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
